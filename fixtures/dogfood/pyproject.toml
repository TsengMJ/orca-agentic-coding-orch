[project]
name = "dogfood"
version = "0.1.0"
description = "Minimal AAC practice surface for GATE_CMD"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dogfood"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
