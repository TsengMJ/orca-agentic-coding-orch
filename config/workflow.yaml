# Single source of truth for AAC × Orca practice runs.
# Change models / gates / human checkpoints here — do not hardcode in prompts.
# Optional env overrides (highest precedence):
#   AAC_SLOT_A_MODEL, AAC_SLOT_B_MODEL, AAC_SLOT_I_MODEL
#   AAC_GATE_CMD, AAC_BUILD_GATE_CMD, AAC_MAX_ROUNDS
#   AAC_AGENT_CALL_RETRIES, AAC_AGENT_TIMEOUT_SEC, AAC_NOTIFY_CMD
#   AAC_HUMAN_GATE, AAC_HUMAN_GATE_PLAN, AAC_OPEN_PR  (1/0, true/false)

schema: 1

slots:
  # Global fallbacks when a stage has no override.
  A:
    runtime: cursor
    model: composer-2.5
    args: []
  B:
    runtime: cursor
    model: grok-4.6
    args: []
  # null = inherit owner (roles.owner → slot A by default), then stage_models
  I: null

# Per-stage A/B/I models (Free Cursor pool: grok-4.7 / 4.6 / 4.5 / composer-2.5).
# Same stage never uses one model for both sides.
stage_models:
  spec:
    A: composer-2.5
    B: grok-4.6
  plan:
    A: grok-4.6
    B: composer-2.5
  acceptance:
    A: grok-4.6
    B: composer-2.5
  implement:
    I: composer-2.5
  gate:
    I: composer-2.5
    B: grok-4.6
  final:
    A: composer-2.5
    B: grok-4.5

roles:
  owner: A
  reviewer: B
  # Role pack used when composing stage prompts
  pack: memory/roles

gates:
  human_gate: true
  human_gate_plan: false
  # AAC: bounds every review loop AND later command-gate repairs. Exhaust → abort + notify.
  max_rounds: 3
  # Same-call retries after timeout/nonzero (gate_loop-style repair), then abort.
  agent_call_retries: 2
  agent_timeout_sec: 480
  # Optional: sh -c '<notify_cmd> "$1"' with message as $1
  notify_cmd: ""
  # Run from repo root; dogfood is the default GATE target for S0+
  # AAC_RUN_ID scopes acceptance to one feature so parallel dogfoods do not collide.
  gate_cmd: "cd fixtures/dogfood && uv run --group dev pytest -q tests/test_smoke.py tests/acceptance/${AAC_RUN_ID}"
  build_gate_cmd: ""
  open_pr: false

modes:
  dual_spec: false
  phases: false

orca:
  agent_hooks: required
  worktree_name_prefix: aac-
  keep_open_implement: true

# Sidecar: watches failed/stuck runs; resume flakes; diagnose/fix orch bugs.
# Does not replace Role 00; never edits product stage artifacts.
healer:
  enabled: true
  poll_sec: 90
  max_auto_resume_per_run: 1
  stale_running_sec: 3600
  # off = resume/escalate only; propose = diagnosis+notify; auto = spawn fix agent + draft PR
  orch_fix: auto
  # null = inherit slots.A model
  model: null

github:
  repo: TsengMJ/orca-agentic-coding-orch
  base: dev
  # Default collaboration: one Issue, one branch, one draft PR.
  # Branches are feature/<slug> or fix/<slug>. Pull requests merge into dev.
  issue_pr: one-to-one
  branch_kinds:
    - feature
    - fix
  draft: true
  max_jobs: 1
  issue_poll_sec: 60
  pr_poll_sec: 30
  health_port: 8765
  # One workflow label at a time. Ready is on issues; the rest are on draft PRs.
  labels:
    ready: Ready
    spec: Spec
    plan: Plan
    acceptance: Acceptance
    implement: Implement
    gate: Gate
    spec_approved: Spec_Approved
    plan_approved: Plan_Approved
    acceptance_approved: Acceptance_Approved
    implement_approved: Implement_Approved
    gate_approved: Gate_Approved
    abort: Abort

paths:
  aac_root: aac
  prompts_dir: prompts
  artifacts_dir: artifacts/runs
  merge_policy: memory/roles/contracts/merge-policy.yaml
  review_contract: memory/roles/contracts/review-output.md
